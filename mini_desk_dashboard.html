<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Desk Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for crisp, minimal icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Smooth animation for disappearing tasks */
        .task-hide {
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
        }
        
        /* Utility classes for scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .thin-scrollbar::-webkit-scrollbar { width: 4px; display: block; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 10px; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 h-screen w-screen overflow-hidden flex relative selection:bg-stone-200">
    
    <!-- Fullscreen Toggle Button -->
    <button id="fs-btn" class="absolute bottom-4 right-4 p-2 text-stone-400 hover:text-stone-600 transition-colors z-50">
        <i data-lucide="maximize" class="w-5 h-5"></i>
    </button>

    <!-- Main Grid Layout -->
    <div class="flex w-full h-full p-6 md:p-8 gap-6 md:gap-8 max-w-5xl mx-auto">
        
        <!-- Left Column: Tasks (55%) -->
        <div class="flex flex-col h-full w-[55%]">
            <h2 class="text-xs font-semibold uppercase tracking-widest text-stone-400 mb-4">Today's Focus</h2>
            
            <div id="task-list" class="flex-1 overflow-y-auto space-y-2 pr-4 pb-12 no-scrollbar">
                <!-- JavaScript populates tasks here -->
            </div>
        </div>

        <!-- Right Column: Dashboard Data (45%) -->
        <div class="flex flex-col h-full w-[45%] border-l border-stone-200 pl-6 md:pl-8 py-2">
            
            <!-- Top Row: Time & Date + Weather -->
            <div class="flex justify-between items-start mb-8 shrink-0">
                <!-- Time & Date -->
                <div>
                    <div id="clock" class="text-4xl md:text-5xl font-light tracking-tight text-stone-900 mb-1">--:--</div>
                    <div id="date" class="text-xs md:text-sm font-medium text-stone-500">Loading...</div>
                </div>

                <!-- Weather Mockup -->
                <div class="text-right flex flex-col items-end">
                    <div class="flex items-center gap-2 md:gap-3 mb-1">
                        <span class="text-xl md:text-2xl font-light">22°</span>
                        <i data-lucide="cloud-sun" class="w-5 h-5 md:w-6 md:h-6 text-stone-600"></i>
                    </div>
                    <div class="text-[10px] md:text-xs text-stone-500 flex items-center gap-1 justify-end mt-1">
                        <i data-lucide="umbrella" class="w-3 h-3"></i>
                        0% rain
                    </div>
                </div>
            </div>

            <!-- Calendar Mockup (Full Day) -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <h2 class="text-[10px] md:text-xs font-semibold uppercase tracking-widest text-stone-400 mb-2 md:mb-3 shrink-0">Today's Schedule</h2>
                <div id="schedule-list" class="space-y-3 md:space-y-4 overflow-y-auto pr-3 pb-8 flex-1 thin-scrollbar scroll-smooth">
                    <!-- JavaScript populates schedule here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Render Icons
        lucide.createIcons();

        // 2. Populate Tasks
        const tasks = [
            "Review Q3 marketing strategy",
            "Send updated proposal to client",
            "Reply to pending team emails",
            "Draft UI component specifications",
            "Approve weekly budget report",
            "Schedule dentist appointment",
            "Update project timeline"
        ];

        const taskList = document.getElementById('task-list');
        
        tasks.forEach(taskText => {
            const label = document.createElement('label');
            label.className = "flex items-center gap-3 md:gap-4 p-2 md:p-3 rounded-xl hover:bg-stone-100 transition-colors cursor-pointer group";
            
            label.innerHTML = `
                <div class="relative flex items-center justify-center w-4 h-4 md:w-5 md:h-5 border-2 border-stone-300 rounded-full group-hover:border-stone-500 transition-colors shrink-0">
                    <input type="checkbox" class="peer opacity-0 absolute w-full h-full cursor-pointer" onchange="completeTask(this)">
                    <i data-lucide="check" class="w-3 h-3 text-stone-600 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></i>
                </div>
                <span class="text-xs md:text-sm text-stone-700 transition-all peer-checked:text-stone-400 peer-checked:line-through">${taskText}</span>
            `;
            taskList.appendChild(label);
        });
        
        // Render checkmarks for new tasks
        lucide.createIcons();

        // 3. Task Click Logic
        window.completeTask = function(checkbox) {
            const taskEl = checkbox.closest('label');
            setTimeout(() => {
                taskEl.classList.add('task-hide');
                setTimeout(() => taskEl.remove(), 300); 
            }, 300); 
        };

        // 4. Populate and Auto-Scroll Schedule
        function renderSchedule() {
            const scheduleList = document.getElementById('schedule-list');
            scheduleList.innerHTML = ''; 
            
            // Mock schedule data
            const scheduleEvents = [
                { start: "08:00", end: "09:00", title: "Morning Review" },
                { start: "09:30", end: "10:30", title: "Team Standup" },
                { start: "11:00", end: "12:00", title: "Design Sync" },
                { start: "12:30", end: "13:30", title: "Lunch Break" },
                { start: "14:00", end: "15:30", title: "Deep Work" },
                { start: "16:00", end: "17:00", title: "Client Call" },
                { start: "18:00", end: "19:00", title: "Gym" }
            ];

            // Dynamically ensure there's an active event right now so you can test the prototype
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const hasActive = scheduleEvents.some(evt => {
                const s = parseInt(evt.start.split(':')[0]) * 60 + parseInt(evt.start.split(':')[1]);
                const e = parseInt(evt.end.split(':')[0]) * 60 + parseInt(evt.end.split(':')[1]);
                return currentMins >= s && currentMins < e;
            });

            if (!hasActive) {
                const currentH = String(now.getHours()).padStart(2, '0');
                const nextH = String((now.getHours() + 1) % 24).padStart(2, '0');
                scheduleEvents.push({ start: `${currentH}:00`, end: `${nextH}:00`, title: "Live Test Block" });
                scheduleEvents.sort((a, b) => a.start.localeCompare(b.start));
            }

            let activeElement = null;

            scheduleEvents.forEach(evt => {
                const startMins = parseInt(evt.start.split(':')[0]) * 60 + parseInt(evt.start.split(':')[1]);
                const endMins = parseInt(evt.end.split(':')[0]) * 60 + parseInt(evt.end.split(':')[1]);
                
                let state = 'future';
                if (currentMins >= endMins) state = 'past';
                else if (currentMins >= startMins && currentMins < endMins) state = 'current';

                const div = document.createElement('div');
                
                if (state === 'past') {
                    div.className = "border-l-2 border-stone-300 pl-2 md:pl-3 opacity-60";
                    div.innerHTML = `
                        <div class="text-[10px] md:text-xs font-medium text-stone-400 mb-0.5 line-through">${evt.start} - ${evt.end}</div>
                        <div class="text-xs md:text-sm font-medium text-stone-400 line-through">${evt.title}</div>
                    `;
                } else if (state === 'current') {
                    div.className = "border-l-2 border-emerald-400 pl-2 md:pl-3 relative py-1";
                    div.innerHTML = `
                        <div class="absolute -left-[5px] top-2.5 w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.6)]"></div>
                        <div class="text-[10px] md:text-xs font-bold text-emerald-600 mb-0.5">${evt.start} - ${evt.end}</div>
                        <div class="text-xs md:text-sm font-semibold text-stone-900">Current: ${evt.title}</div>
                    `;
                    activeElement = div;
                } else {
                    div.className = "border-l-2 border-stone-300 pl-2 md:pl-3";
                    div.innerHTML = `
                        <div class="text-[10px] md:text-xs font-medium text-stone-500 mb-0.5">${evt.start} - ${evt.end}</div>
                        <div class="text-xs md:text-sm font-medium text-stone-800">${evt.title}</div>
                    `;
                }
                scheduleList.appendChild(div);
            });

            // Auto-scroll to center the active block
            if (activeElement) {
                setTimeout(() => {
                    activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300); // Slight delay ensures DOM is fully painted
            }
        }
        
        renderSchedule();

        // 5. Live Clock Logic
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 5. Fullscreen Logic
        const fsBtn = document.getElementById('fs-btn');
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Error attempting to enable fullscreen:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
